<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - 24 SHOP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #141414, #cc0000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }

        .login-box {
            width: 380px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: left;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-container.hidden {
            display: none;
            opacity: 0;
            transform: scale(0.95);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .input-box {
            margin: 20px 0;
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-box input:focus {
            border-color: #ff3333;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #ff0000, #990000);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            background: linear-gradient(135deg, #ff3333, #b30000);
        }

        .btn:active {
            transform: translateY(0);
        }

        p {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-link {
            color: #ff3333;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
            text-decoration: none;
        }

        .toggle-link:hover {
            color: #ff6666;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <!-- Log In Form Container -->
        <div id="login-container" class="form-container">
            <h2>Log In</h2>
            <form action="login.php" method="POST" id="loginform">
                <input type="hidden" name="action" value="login">
                <div class="input-box">
                    <input type="email" name="loginEmail" placeholder="Email Address" required>
                </div>
                <div class="input-box">
                    <input type="password" name="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Log In</button>
                <p>Need an account? <span class="toggle-link" onclick="toggleForm()">Sign Up</span></p>
            </form>
        </div>

        <!-- Sign Up Form Container -->
        <div id="signup-container" class="form-container hidden">
            <h2>Sign Up</h2>
            <form action="signup.php" method="POST" id="signupform">
                <div class="input-box">
                    <input type="text" name="fullname" placeholder="Full Name" required>
                </div>

                <div class="input-box">
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password (Min 4 chars)" minlength="4" required>
                </div>

                <button type="submit" class="btn">Create Account</button>
                <p>Already have an account?
                    <span class="toggle-link" onclick="toggleForm()">Log In</span>
                </p>
            </form>
        </div>
    </div>

    <script>
        function toggleForm() {
            const loginContainer = document.getElementById("login-container");
            const signUpContainer = document.getElementById("signup-container");

            // Toggle visibility classes
            loginContainer.classList.toggle("hidden");
            signUpContainer.classList.toggle("hidden");
        }
    </script>

</body>

</html>
